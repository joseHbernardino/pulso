name: CI

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches: [main]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "flake.nix"
      - "flake.lock"
      - ".github/**"
      - "internal/web/frontend/**"
      - "nix/**"
      - "scripts/update-vendor-hash.sh"
  pull_request:
    branches: [main]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "flake.nix"
      - "flake.lock"
      - ".github/**"
      - "internal/web/frontend/**"
      - "nix/**"
      - "scripts/update-vendor-hash.sh"

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify dependencies
        run: go mod verify

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -trimpath ./...

      - name: Format check
        run: test -z "$(gofmt -l -s .)"

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

      - name: Test
        run: go test -v -count=1 -race -timeout 120s ./...

      - name: Test (E2E)
        run: go test -v -count=1 -timeout 120s ./internal/e2e/...

  build-matrix:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          CGO_ENABLED=0 go build \
            -buildvcs=false \
            -trimpath \
            -ldflags "-s -w -X pulso.local/pulso/internal/version.Version=ci" \
            -o pulso \
            ./cmd/pulso

  nix:
    name: Nix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15

      # Precede os demais passos porque um vendorHash desatualizado quebra tanto
      # o flake check quanto o build com um "hash mismatch" que não diz o que
      # fazer. Aqui a falha informa o valor correto. Quando o hash está em dia a
      # derivação é só reaproveitada pelos passos seguintes, sem custo extra.
      - name: Verify vendor hash
        run: sh scripts/update-vendor-hash.sh --check

      - name: Check flake
        run: nix flake check --all-systems

      - name: Build
        run: nix build .

      - name: Verify binary
        run: ./result/bin/pulso version

  docker-integration:
    name: Integração com o Docker Engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # Estes testes falam com o Engine de verdade: validam o formato das
      # respostas do Docker, a classificação de propriedade, as proteções da
      # infraestrutura e a honestidade da simulação de limpeza.
      - name: Métricas e inventário contra o Docker real
        run: |
          go test -tags integration -v -timeout 10m ./internal/containerupdate/             -run 'TestContainerStatsAgainstRealDocker|TestInventoryAgainstRealDocker'

  security:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install scanner
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Scan application and tests
        run: govulncheck -test ./...
