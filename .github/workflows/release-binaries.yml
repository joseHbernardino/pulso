name: Release binaries

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      revision:
        required: true
        type: string

permissions:
  contents: read

env:
  APP_NAME: pulso

jobs:
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
          - goos: linux
            goarch: arm64
            runner: ubuntu-latest
          - goos: darwin
            goarch: amd64
            runner: macos-latest
          - goos: darwin
            goarch: arm64
            runner: macos-latest
          - goos: windows
            goarch: amd64
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.revision }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p dist

          ext=""
          [ "${GOOS}" = "windows" ] && ext=".exe"

          CGO_ENABLED=0 go build \
            -buildvcs=false \
            -trimpath \
            -ldflags "-s -w -X pulso.local/pulso/internal/version.Version=${VERSION} -X pulso.local/pulso/internal/version.Revision=${SOURCE_SHA} -X pulso.local/pulso/internal/version.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ) -X pulso.local/pulso/internal/version.ReleaseRepository=${GITHUB_REPOSITORY}" \
            -o "dist/${APP_NAME}_${GOOS}_${GOARCH}${ext}" \
            ./cmd/pulso

          # Package into archive.
          pkg_dir="dist/${APP_NAME}_${VERSION}_${GOOS}_${GOARCH}"
          mkdir -p "${pkg_dir}"
          cp "dist/${APP_NAME}_${GOOS}_${GOARCH}${ext}" "${pkg_dir}/${APP_NAME}${ext}"
          cp README.md "${pkg_dir}/"
          cp LICENSE "${pkg_dir}/"
          cp -R licenses "${pkg_dir}/licenses"

          if [ "${GOOS}" = "windows" ]; then
            (cd dist && zip -rq "${APP_NAME}_${VERSION}_${GOOS}_${GOARCH}.zip" "$(basename "${pkg_dir}")")
          else
            tar -C dist -czf "dist/${APP_NAME}_${VERSION}_${GOOS}_${GOARCH}.tar.gz" "$(basename "${pkg_dir}")"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/${{ env.APP_NAME }}_${{ matrix.goos }}_${{ matrix.goarch }}*
          if-no-files-found: error
