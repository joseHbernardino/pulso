name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  APP_NAME: pulso

jobs:
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
          - goos: linux
            goarch: arm64
            runner: ubuntu-latest
          - goos: darwin
            goarch: amd64
            runner: macos-latest
          - goos: darwin
            goarch: arm64
            runner: macos-latest
          - goos: windows
            goarch: amd64
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build
        env:
          VERSION: ${{ github.ref_name }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p dist

          ext=""
          [ "${GOOS}" = "windows" ] && ext=".exe"

          CGO_ENABLED=0 go build \
            -buildvcs=false \
            -trimpath \
            -ldflags "-s -w -X pulso.local/pulso/internal/version.Version=${VERSION} -X pulso.local/pulso/internal/version.Revision=${GITHUB_SHA} -X pulso.local/pulso/internal/version.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ) -X pulso.local/pulso/internal/version.ReleaseRepository=${GITHUB_REPOSITORY}" \
            -o "dist/${APP_NAME}_${GOOS}_${GOARCH}${ext}" \
            ./cmd/pulso

          # Package into archive.
          pkg_dir="dist/${APP_NAME}_${VERSION}_${GOOS}_${GOARCH}"
          mkdir -p "${pkg_dir}"
          cp "dist/${APP_NAME}_${GOOS}_${GOARCH}${ext}" "${pkg_dir}/${APP_NAME}${ext}"
          cp README.md "${pkg_dir}/"
          cp LICENSE "${pkg_dir}/"

          if [ "${GOOS}" = "windows" ]; then
            (cd dist && zip -rq "${APP_NAME}_${VERSION}_${GOOS}_${GOARCH}.zip" "$(basename "${pkg_dir}")")
          else
            tar -C dist -czf "dist/${APP_NAME}_${VERSION}_${GOOS}_${GOARCH}.tar.gz" "$(basename "${pkg_dir}")"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/${{ env.APP_NAME }}_${{ matrix.goos }}_${{ matrix.goarch }}*
          if-no-files-found: error

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.tar.gz *.zip \
            ${APP_NAME}_linux_amd64 \
            ${APP_NAME}_linux_arm64 \
            ${APP_NAME}_darwin_amd64 \
            ${APP_NAME}_darwin_arm64 \
            ${APP_NAME}_windows_amd64.exe \
            > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            dist/${{ env.APP_NAME }}_linux_amd64
            dist/${{ env.APP_NAME }}_linux_arm64
            dist/${{ env.APP_NAME }}_darwin_amd64
            dist/${{ env.APP_NAME }}_darwin_arm64
            dist/${{ env.APP_NAME }}_windows_amd64.exe
