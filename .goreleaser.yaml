version: 2
project_name: pulso

before:
  hooks:
    - go mod tidy

builds:
  - id: pulso
    main: ./cmd/pulso
    binary: pulso
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X pulso.local/pulso/internal/version.Version={{.Version}}
      - -X pulso.local/pulso/internal/version.BuildTime={{.Date}}
      - -X pulso.local/pulso/internal/version.ReleaseRepository={{ .Env.GITHUB_REPOSITORY }}

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_
      {{- .Os }}_
      {{- .Arch }}
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE
      - README.md
      - licenses/*

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "merge conflict"
  groups:
    - title: Features
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 0
    - title: Bug Fixes
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 1
    - title: Others
      order: 999

release:
  draft: false
  prerelease: auto
  mode: replace

nfpms:
  - id: default
    package_name: pulso
    description: "A modern process manager and application supervisor"
    maintainer: Pulso Contributors
    license: MIT
    formats:
      - deb
      - rpm
      - apk
    contents:
      - src: ./LICENSE
        dst: /usr/share/doc/pulso/LICENSE
      - src: ./licenses/moby-patternmatcher.LICENSE
        dst: /usr/share/doc/pulso/licenses/moby-patternmatcher.LICENSE
      - src: ./licenses/moby-patternmatcher.NOTICE
        dst: /usr/share/doc/pulso/licenses/moby-patternmatcher.NOTICE
      - src: ./licenses/dokploy.LICENSE
        dst: /usr/share/doc/pulso/licenses/dokploy.LICENSE
      - src: ./licenses/dokploy.NOTICE
        dst: /usr/share/doc/pulso/licenses/dokploy.NOTICE
      - src: ./licenses/docker-cli.LICENSE
        dst: /usr/share/doc/pulso/licenses/Apache-2.0.txt
