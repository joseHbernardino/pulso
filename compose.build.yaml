# Build from this checkout before the first registry image is published.
services:
  pulso:
    image: pulso:local
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile
      target: ${PULSO_BUILD_TARGET:-runtime}
      args:
        VERSION: ${PULSO_BUILD_VERSION:-dev}
        REVISION: ${PULSO_BUILD_REVISION:-unknown}
        BUILD_TIME: ${PULSO_BUILD_TIME:-unknown}
        RELEASE_REPOSITORY: ${PULSO_RELEASE_REPOSITORY:-}
