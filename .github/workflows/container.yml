name: Container

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Build and test container (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [runtime, runtime-python311]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Validate Compose
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.build.yaml config --quiet
          docker compose -f compose.yaml -f compose.host.yaml config --quiet
          docker compose -f compose.yaml -f compose.build.yaml -f compose.host.yaml config --quiet
          docker compose -f compose.yaml -f compose.update.yaml config --quiet
          docker compose -f compose.yaml -f compose.host.yaml -f compose.update.yaml config --quiet
      - name: Build test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: pulso:smoke
          target: ${{ matrix.target }}
          build-args: |
            VERSION=dev
            REVISION=${{ github.sha }}
            RELEASE_REPOSITORY=${{ github.repository }}
          cache-from: type=gha,scope=pulso-container-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=pulso-container-${{ matrix.target }}
      - name: Test login, dotenv and recovery after container replacement
        run: |
          python3 scripts/docker-smoke.py pulso:smoke
          python3 scripts/docker-host-smoke.py pulso:smoke
      - name: Test automatic installation and preservation of existing settings
        if: matrix.target == 'runtime'
        run: python3 scripts/docker-install-smoke.py
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.target == 'runtime'
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Test portal image update and automatic rollback
        if: matrix.target == 'runtime'
        run: bash scripts/docker-update-smoke.sh pulso:smoke

  publish:
    name: Publish Linux images (${{ matrix.target }})
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: runtime
            suffix: ""
          - target: runtime-python311
            suffix: -python311
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image names
        id: image
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          IMAGE_SUFFIX: ${{ matrix.suffix }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          image="ghcr.io/${REPOSITORY,,}"
          tags="$image:$RELEASE_TAG$IMAGE_SUFFIX"
          if [[ "$RELEASE_TAG" != *-* ]]; then
            tags="$tags,$image:latest$IMAGE_SUFFIX"
          fi
          printf 'tags=%s\n' "$tags" >> "$GITHUB_OUTPUT"
          printf 'build_time=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          target: ${{ matrix.target }}
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
            BUILD_TIME=${{ steps.image.outputs.build_time }}
            RELEASE_REPOSITORY=${{ github.repository }}
          cache-from: type=gha,scope=pulso-container-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=pulso-container-${{ matrix.target }}
          provenance: mode=max
          sbom: true
