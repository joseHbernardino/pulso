name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment (main only)
        type: choice
        options: [patch, minor, major]
        default: patch

# GitHub.com queues main updates instead of replacing an already pending run.
# queue:max is documented by GitHub; actionlint <=1.7.12 predates this field.
concurrency:
  group: pulso-release-${{ github.repository }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  validate:
    name: Go validation
    uses: ./.github/workflows/ci.yml

  container-check:
    name: Container validation
    uses: ./.github/workflows/container.yml

  installer-check:
    name: Installer validation
    uses: ./.github/workflows/installer.yml

  version:
    name: Reserve release version
    needs: [validate, container-check, installer-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.plan.outputs.version }}
      revision: ${{ steps.plan.outputs.revision }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Select or reuse the version for this commit
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_BUMP: ${{ inputs.bump || 'patch' }}
          RELEASE_INTENT: ${{ github.event_name == 'workflow_dispatch' && github.run_id || '' }}
        run: |
          python3 scripts/release_automation.py plan \
            --ref "$RELEASE_REF" --sha "$RELEASE_SHA" --bump "$RELEASE_BUMP" \
            --intent "$RELEASE_INTENT" \
            --create-tag --check-published --output "$GITHUB_OUTPUT"

  binaries:
    name: Package binaries
    needs: version
    if: needs.version.outputs.publish == 'true'
    uses: ./.github/workflows/release-binaries.yml
    with:
      version: ${{ needs.version.outputs.version }}
      revision: ${{ needs.version.outputs.revision }}

  images:
    name: Publish versioned images
    needs: version
    if: needs.version.outputs.publish == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release-images.yml
    with:
      version: ${{ needs.version.outputs.version }}
      revision: ${{ needs.version.outputs.revision }}

  draft:
    name: Prepare release and checksums
    needs: [version, binaries]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.tar.gz *.zip \
            pulso_linux_amd64 pulso_linux_arm64 \
            pulso_darwin_amd64 pulso_darwin_arm64 pulso_windows_amd64.exe \
            > checksums.txt
      - name: Create or resume a draft release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.version.outputs.version }}
          target_commitish: ${{ needs.version.outputs.revision }}
          name: Pulso ${{ needs.version.outputs.version }}
          draft: true
          prerelease: ${{ contains(needs.version.outputs.version, '-') }}
          generate_release_notes: true
          make_latest: 'false'
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            dist/pulso_linux_amd64
            dist/pulso_linux_arm64
            dist/pulso_darwin_amd64
            dist/pulso_darwin_arm64
            dist/pulso_windows_amd64.exe

  publish:
    name: Promote Docker tags and publish release
    needs: [version, images, draft]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.revision }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Make the completed version available to the updater
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: python3 scripts/release_automation.py publish --version "$RELEASE_VERSION"
