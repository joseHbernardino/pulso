name: Release images

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      revision:
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish Linux images (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: runtime
            suffix: ""
          - target: runtime-python311
            suffix: -python311
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image names
        id: image
        env:
          RELEASE_TAG: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
          IMAGE_SUFFIX: ${{ matrix.suffix }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          image="ghcr.io/${REPOSITORY,,}"
          tags="$image:$RELEASE_TAG$IMAGE_SUFFIX"
          printf 'tags=%s\n' "$tags" >> "$GITHUB_OUTPUT"
          printf 'build_time=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          target: ${{ matrix.target }}
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.revision }}
            org.opencontainers.image.version=${{ inputs.version }}
          build-args: |
            VERSION=${{ inputs.version }}
            REVISION=${{ inputs.revision }}
            BUILD_TIME=${{ steps.image.outputs.build_time }}
            RELEASE_REPOSITORY=${{ github.repository }}
          cache-from: type=gha,scope=pulso-container-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=pulso-container-${{ matrix.target }},ignore-error=true
          provenance: mode=max
          sbom: true
